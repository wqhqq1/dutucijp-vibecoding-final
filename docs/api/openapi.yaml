                "type": "object"
              "type": "array"
            "attestation":
              "type": "string"
            "authenticatorSelection":
              "additionalProperties": true
              "type": "object"
            "challenge":
              "type": "string"
            "excludeCredentials":
              "items":
                "additionalProperties": false
                "properties":
                  "id":
                    "type": "string"
                  "transports":
                    "items":
                      "type": "string"
                    "type": "array"
                  "type":
                    "type": "string"
                "required":
                  - "type"
                  - "id"
                "type": "object"
              "type": "array"
            "extensions":
              "additionalProperties": true
              "type": "object"
            "pubKeyCredParams":
              "items":
                "additionalProperties": false
                "properties":
                  "alg":
                    "type": "integer"
                  "type":
                    "type": "string"
                "required":
                  - "type"
                  - "alg"
                "type": "object"
              "type": "array"
            "rp":
              "additionalProperties": false
              "properties":
                "id":
                  "type": "string"
                "name":
                  "type": "string"
              "required":
                - "id"
                - "name"
              "type": "object"
            "rpId":
              "type": "string"
            "timeout":
              "type": "integer"
            "user":
              "additionalProperties": false
              "properties":
                "displayName":
                  "type": "string"
                "id":
                  "type": "string"
                "name":
                  "type": "string"
              "required":
                - "id"
                - "name"
                - "displayName"
              "type": "object"
            "userVerification":
              "type": "string"
          "required":
            - "challenge"
          "type": "object"
      "required":
