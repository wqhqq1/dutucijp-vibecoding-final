    "WebAuthnOptions":
      "properties":
        "publicKey":
          "additionalProperties": true
          "properties":
            "allowCredentials":
              "items":
                "additionalProperties": false
                "properties":
                  "id":
                    "type": "string"
                  "transports":
                    "items":
                      "type": "string"
                    "type": "array"
                  "type":
                    "type": "string"
                "required":
