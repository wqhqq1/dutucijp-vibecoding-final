          "description": "必须与实际连接入口的获准 Origin 完全一致"
          "in": "header"
          "name": "Origin"
          "required": true
          "schema":
            "type": "string"
        -
          "description": "有会话时必填；Passkey login finish 必须使用 begin 返回的 csrf，包括匿名 selection Cookie"
          "in": "header"
          "name": "X-CSRF-Token"
          "required": false
          "schema":
            "type": "string"
      "requestBody":
        "content":
          "application/json":
            "schema":
              "additionalProperties": false
              "properties":
                "reason":
                  "type": "string"
              "required":
                - "reason"
              "type": "object"
        "required": true
      "responses":
        "200":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/auth_WarehouseRequest"
          "description": "成功；当前协议所有成功操作使用 HTTP 200"
        "401":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Problem"
          "description": "认证失败/会话失效"
        "403":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Problem"
          "description": "权限、配置、Host、Origin 或 CSRF 不符"
        "404":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Problem"
          "description": "资源不存在"
        "409":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Problem"
          "description": "版本、数量、材料或任务冲突"
        "422":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Problem"
          "description": "输入无效"
        "429":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Problem"
          "description": "认证尝试限流"
        "500":
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Problem"
          "description": "服务内部错误"
      "security":
        -
          "SessionCookie": []
      "summary": "驳回申请"
      "tags":
        - "warehouse-requests"
      "x-role": "admin"
