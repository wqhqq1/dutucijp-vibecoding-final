        "created_at":
          "type": "string"
        "failed":
          "type": "integer"
        "groups":
          "type": "integer"
        "id":
          "type": "string"
        "items":
          "items":
            "additionalProperties": false
            "properties":
              "cancel_id":
                "type": "string"
              "case_id":
                "type": "string"
              "code":
                "type": "string"
              "customer":
                "type": "string"
              "group_id":
                "type": "integer"
              "group_size":
                "type": "integer"
              "invoice":
                "type": "string"
              "message":
                "type": "string"
              "option":
                "anyOf":
                  -
                    "$ref": "#/components/schemas/store_ReviewOption"
                  -
                    "type": "null"
              "status":
                "type": "string"
              "stock":
                "type": "string"
              "version":
                "type": "integer"
            "required":
              - "case_id"
              - "cancel_id"
              - "invoice"
              - "customer"
              - "stock"
              - "version"
              - "option"
              - "status"
              - "code"
              - "message"
              - "group_id"
              - "group_size"
            "type": "object"
          "type": "array"
        "page":
          "type": "integer"
        "page_size":
          "type": "integer"
        "readonly":
          "type": "integer"
        "ready":
          "type": "integer"
        "reasons":
          "anyOf":
            -
              "items":
                "additionalProperties": false
                "properties":
                  "code":
                    "type": "string"
                  "count":
                    "type": "integer"
                  "message":
                    "type": "string"
                "required":
                  - "code"
                  - "message"
                  - "count"
                "type": "object"
              "type": "array"
            -
              "type": "null"
        "set_id":
          "type": "string"
        "skipped":
          "type": "integer"
        "status":
          "type": "string"
        "succeeded":
          "type": "integer"
        "total":
          "type": "integer"
        "view":
          "type": "string"
        "view_total":
          "type": "integer"
      "required":
        - "id"
        - "set_id"
        - "action"
        - "status"
        - "created_at"
        - "total"
        - "succeeded"
        - "skipped"
        - "failed"
        - "ready"
        - "readonly"
        - "groups"
        - "reasons"
        - "view"
        - "view_total"
        - "items"
        - "page"
        - "page_size"
      "type": "object"
    "Job":
